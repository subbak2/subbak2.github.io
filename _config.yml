about_content: | # this will include new lines to allow paragraphs
  클라우드 **PostgreSQL DBaaS**를 만드는 소프트웨어·DB 엔지니어입니다.<br/><br/>
  삼성SDS에서 Samsung Cloud Platform(SCP)의 DBaaS를 개발하고 있고, 그 전에는 삼성카드에 파견되어 백엔드 개발자와 Oracle DBA로 일했습니다.<br/>
  퇴근 후에는 맥에서 불편한 것 하나를 고치는 작은 앱을 만들고, 직접 써 본 개발·AI 도구 이야기를 씁니다.

content:
  - title: 경력
    layout: list
    content:
      - layout: left
        title: 삼성SDS
        sub_title: DBaaS Engineer
        caption: 2024.06 ~ 현재
        description: |
          Samsung Cloud Platform(SCP) DBaaS 개발
          * **PostgreSQL DBaaS** 개발 (2026.06 ~)
          * OpenSearch·Elasticsearch DBaaS: 프로비저닝·스케일링·모니터링 자동화, 컨트롤 플레인과 플랫폼 아키텍처
          * DBaaS TA·DBA 부담당 겸업 (2025 ~)
      - layout: left
        title: 삼성SDS
        sub_title: DBA · 삼성카드 파견
        caption: 2020.04 ~ 2024.05
        description: |
          고객사 금융 시스템의 Oracle 운영
          * SQL 튜닝, 논리 설계, 스토리지 최적화
          * 고가용성 확보, 서버·DB 모니터링
      - layout: left
        title: 삼성SDS
        sub_title: Backend Developer · 삼성카드 파견
        caption: 2019.03 ~ 2020.03
        description: |
          고객사 Java/Spring 백엔드 개발
          * 사내 SW 알고리즘 강사 (C++, Java)
          * 베트남 CMC Global과 GDC 프로젝트 아키텍트

  - title: AI 활용
    layout: text
    content: |
      사이드 프로젝트는 작은 AI 팀으로 굴러갑니다. **Claude**(Claude Code)가 코드를 쓰고 배포하고, **Gemini**가 조사하고, **Codex**가 실제 데이터에 손대기 전에 한 번 더 검토합니다. 아래 사이드 프로젝트도 이렇게 만들었습니다.

      요즘 관심: AI 영상·음악 (Higgsfield, Kling, Suno)

  - title: 사이드 프로젝트
    layout: list
    content:
      - layout: left
        title: PortableHiDPI
        link: github.com/subbak2/PortableHiDPI
        link_text: GitHub
        description: |
          14~16인치 휴대용 모니터에서 맥 글씨를 레티나(HiDPI)로 선명하게. Apple Silicon 맥이 막아 둔 중간 해상도 HiDPI를 가상 디스플레이로 켭니다.
      - layout: left
        title: ScrollSplit
        link: github.com/subbak2/ScrollSplit
        link_text: GitHub
        description: |
          트랙패드는 자연스러운 스크롤, 마우스는 일반 스크롤로 동시에. 손쉬운 사용 권한 하나만 쓰고 스크롤 외의 입력은 받지 않습니다.
      - layout: left
        title: php-docker-hotpatch
        link: github.com/subbak2/php-docker-hotpatch
        link_text: GitHub
        description: |
          PHP 보안 릴리스 직후 Docker 공식 이미지가 뒤처졌을 때, 공식 빌드 파일에서 PHP 버전만 올려 WordPress·PHP 이미지를 직접 빌드하는 도구. 미리 만든 바이너리 없이 SHA256·GPG 검증은 공식과 같습니다.
          * PHP2Shell(CVE-2026-109618·109619) 때 운영 워드프레스에 91분 만에 반영한 과정을 일반화 ([대응기](https://subbak2.tistory.com/217))

