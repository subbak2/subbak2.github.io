<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "ko" }}">

{%- include head.html -%}
    <meta property="og:image" content="https://subbak2.github.io/images/profile.jpg">
<body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
        <div class="wrapper">

            {%- include about.html -%}

            {% for section in site.content %}
              <div class="container {{ section.layout }}-container">
                <h3 id="{{ section.title | slugify }}">{{ section.title }}</h3>
                {% include {{ section.layout | prepend: "section-" | append: ".html" }} content=section.content %}
              </div>
            {% endfor %}

        </div>
    </main>

    {%- include footer.html -%}

    <script src="https://utteranc.es/client.js"
        repo="subbak2/subbak2.github.io"
        issue-term="pathname"
        theme="github-light"
        crossorigin="anonymous"
        async>
    </script>
</body>

</html>
